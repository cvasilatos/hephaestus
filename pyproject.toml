[project]
name = "hephaestus"
version = "0.1.0"
description = "Hephaestus single-server GPU reservation and access enforcement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django~=5.2.0",
  "dj-database-url>=2.2,<4",
  "gunicorn>=23,<24",
  "pamela>=1.2,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]

[project.scripts]
gpu-accessd = "gpu_access.cli:main"
gpu-run = "gpu_access.session:run_main"
gpu-shell = "gpu_access.session:shell_main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gpu_booking.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["postgresql: requires a PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["booking/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"gpu_booking/settings.py" = ["S105"]
"gpu_access/session.py" = ["S606"]
"booking/models.py" = ["DJ008", "DJ012"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["booking/migrations"]

[tool.coverage.run]
branch = true
source = ["booking", "gpu_access", "gpu_booking"]

[tool.coverage.report]
show_missing = true
skip_covered = true
