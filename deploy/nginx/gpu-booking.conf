limit_req_zone $binary_remote_addr zone=gpu_login:10m rate=10r/m;

upstream gpu_booking {
    server unix:/run/gpu-booking/web.sock;
}
server {
    listen 80;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;

    location /static/ {
        alias /opt/gpu-booking/staticfiles/;
        expires 7d;
    }

    location = /login/ {
        limit_req zone=gpu_login burst=5 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://gpu_booking;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://gpu_booking;
    }
}
