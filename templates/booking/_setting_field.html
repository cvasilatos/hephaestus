<div class="setting-field{% if field.field.widget.input_type == 'checkbox' %} setting-toggle{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help-text">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
